#cloud-config
# Portable on purpose: nothing Incus-specific here, the same file works on Proxmox.
users:
  - name: alex
    groups: [wheel]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys: []

write_files:
  - path: /usr/local/share/chezmoi-bootstrap.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu

      if [ -f /run/bw-bootstrap.env ]; then
          set -a
          . /run/bw-bootstrap.env
          set +a
          bw login --apikey
          BW_SESSION="$(bw unlock --passwordfile /run/bw-bootstrap.pw --raw)"
          if [ -z "$BW_SESSION" ]; then
              echo "bw unlock produced no session; the vault stays locked" >&2
              exit 1
          fi
          export BW_SESSION
          # Unlocked or not, never the session: this line is the diagnosis when a
          # template later fails on Bitwarden.
          bw status 2> /dev/null | sed -n 's/.*"status":"\([a-z]*\)".*/bw status: \1/p' >&2
      fi

      CHEZMOI_ROLE=headless sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" init --apply https://github.com/Its-Alex/dotfiles.git

      if [ -f /run/bw-bootstrap.env ]; then
          bw lock
      fi

runcmd:
  - |
    set -eu

    # cloud-init's package module runs before the network is up and never retries.
    # bw and curl must exist before chezmoi init: the secret parts need a session,
    # and the apply that installs the core packages only runs after it.
    attempt=0
    until pacman -Sy --needed --noconfirm git curl sudo openssh bitwarden-cli; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge 5 ]; then
        echo "package install still failing after $attempt attempts" >&2
        exit 1
      fi
      sleep 10
    done

    ssh-keygen -A
    systemctl enable --now sshd

    # The bootstrap below runs through `su -l`, which starts no logind session:
    # without lingering, user units (podman.socket, pitchfork) have no bus and
    # nothing user-level can start before the first login.
    loginctl enable-linger alex

    if [ -f /run/bw-bootstrap.env ]; then
      # Root-owned in the instance config, and the bootstrap below runs as alex.
      chown alex: /run/bw-bootstrap.env /run/bw-bootstrap.pw
      chmod 0600 /run/bw-bootstrap.env /run/bw-bootstrap.pw
    fi
    # Root erases the credentials, failed bootstrap included: alex owns the files
    # but cannot unlink them from the root-owned /run.
    bootstrap_status=0
    su -l alex -c 'sh /usr/local/share/chezmoi-bootstrap.sh' || bootstrap_status=$?
    if [ -f /run/bw-bootstrap.env ]; then
      shred -u /run/bw-bootstrap.env /run/bw-bootstrap.pw
    fi
    exit "$bootstrap_status"
