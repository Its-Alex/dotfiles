kind: profile
name: opencode
description: opencode instances - tun for tailscaled in a container
# security.nesting is unset on purpose: the defaults are the behaviour wanted here.
# A VM gets nested virtualisation (/dev/kvm, svm/vmx); a container stays without
# nesting, which is why --container exists as a no-nested-runtimes mode.
config: {}
devices:
  tun:
    type: unix-char
    path: /dev/net/tun
---
# Rendered by scripts/create-opencode-instance.sh; __VM__ makes a raw apply fail planning.
kind: instance
name: __NAME__
image: images:archlinux/cloud
vm: __VM__
profiles:
  - default
  - opencode
config:
  limits.memory: "8GiB"
  limits.cpu: "4"
  security.secureboot: "false"   # the Arch cloud image cannot boot under secure boot
  cloud-init.user-data: __USER_DATA__
# Rendered by scripts/create-opencode-instance.sh: --repo-mount adds the read-only
# device here, because incus-apply launches the instance and cloud-init needs it
# on the first boot.
devices: __DEVICES__
